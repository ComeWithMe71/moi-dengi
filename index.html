<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Деньги">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#F6F5F1">
<title>Мои деньги</title>
<script src="config.js"></script>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('mk.theme')||'"system"')}catch(e){document.documentElement.dataset.theme='system'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#EFEDE7;--border:#E0DDD4;
  --text:#15171C;--muted:#5B6270;--faint:#8A909C;
  --accent:#8F5E00;--on-accent:#FFFFFF;--gold:#E3A52A;
  --inc:#0B7A4B;--acc:#2F5FD0;--exp:#D2412F;--danger:#C62F22;--warn:#B07400;
  --scrim:rgba(20,20,20,.35);--lift:0 12px 28px rgba(30,25,10,.16);
  --ring:rgba(143,94,0,.28);--ink:#000;--ink-mix:72%;--tile-mix:16%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="system"]{
    --bg:#0E1014;--surface:#171A21;--surface-2:#1F232C;--border:#2A2F3A;
    --text:#F3F4F6;--muted:#9AA3B2;--faint:#6B7385;
    --accent:#F5B83D;--on-accent:#1A1405;--gold:#F5B83D;
    --inc:#3DD68C;--acc:#6F9BFF;--exp:#FF7A6B;--danger:#FF5A4E;--warn:#F5B83D;
    --scrim:rgba(5,6,8,.6);--lift:0 12px 32px rgba(0,0,0,.5);
    --ring:rgba(245,184,61,.35);--ink:#fff;--ink-mix:100%;--tile-mix:18%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014;--surface:#171A21;--surface-2:#1F232C;--border:#2A2F3A;
  --text:#F3F4F6;--muted:#9AA3B2;--faint:#6B7385;
  --accent:#F5B83D;--on-accent:#1A1405;--gold:#F5B83D;
  --inc:#3DD68C;--acc:#6F9BFF;--exp:#FF7A6B;--danger:#FF5A4E;--warn:#F5B83D;
  --scrim:rgba(5,6,8,.6);--lift:0 12px 32px rgba(0,0,0,.5);
  --ring:rgba(245,184,61,.35);--ink:#fff;--ink-mix:100%;--tile-mix:18%;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.ready{transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:calc(96px + env(safe-area-inset-bottom));position:relative}
.cap{font-size:11px;line-height:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.inc{color:var(--inc)}.exp{color:var(--exp)}.acc{color:var(--acc)}.neg{color:var(--danger)}
.ico svg{width:1em;height:1em;stroke-width:2}
i[data-lucide]{display:inline-flex;font-style:normal;align-items:center;justify-content:center}
i[data-lucide]::before{content:attr(data-f);font-weight:800;font-size:.8em}
svg.lucide{width:1em;height:1em;stroke-width:2;flex:none}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 4px}
.bookbtn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;padding:6px 10px 6px 0;border-radius:10px}
.bookbtn .chev{color:var(--muted);font-size:16px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
.iconbtn:hover{background:var(--surface-2)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);font-weight:600}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok .dot{background:var(--inc)}.sync.wait .dot{background:var(--gold)}.sync.err .dot{background:var(--danger)}

.hero{padding:10px 20px 6px}
.total{font-size:36px;line-height:42px;font-weight:800;letter-spacing:-.02em}
.hero .sub{font-size:13px;font-weight:700;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.hero .sub .sep{color:var(--faint)}
.budget{margin-top:12px}
.budget .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.budget .fill{height:100%;border-radius:4px;background:var(--gold);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.budget .fill.over{background:var(--danger)}
.budget .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}

.sec{margin-top:18px}
.sechd{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin-bottom:10px}
.sechd .am{font-size:13px;font-weight:800}
.hrow{display:flex;gap:10px;padding:2px 20px 6px;overflow-x:auto;scroll-snap-type:x proximity;touch-action:pan-x;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px;padding:2px 14px}

/* coin */
.coin{--c:#8E99AB;display:flex;flex-direction:column;align-items:center;gap:5px;width:72px;flex:none;scroll-snap-align:start;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}
.grid .coin{width:auto}
.tile{width:60px;height:60px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px;
  background:color-mix(in srgb,var(--c) var(--tile-mix),var(--surface));
  color:color-mix(in srgb,var(--c) var(--ink-mix),var(--ink));
  border:1px solid color-mix(in srgb,var(--c) 22%,transparent);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,opacity .2s,outline-color .2s;outline:2px solid transparent;outline-offset:3px}
.coin .nm{font-size:12px;line-height:15px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.coin .am{font-size:12px;line-height:14px;font-weight:800;white-space:nowrap}
.coin .bar{width:46px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.coin .bar i{display:block;height:100%;border-radius:2px;background:var(--c)}
.coin .bar i.warn{background:var(--gold)}.coin .bar i.over{background:var(--danger)}
.coin:active .tile{transform:scale(.94)}
.coin.add .tile{background:transparent;border:1.5px dashed var(--border);color:var(--faint);font-size:22px}
.coin.add .nm{color:var(--faint)}
.coin.src .tile{transform:scale(.94);opacity:.35}
.coin.sel .tile{outline-color:var(--gold);box-shadow:0 0 0 6px var(--ring)}
body.picking .coin:not(.ok):not(.sel):not(.add) .tile{opacity:.28}
body.picking .coin.add{opacity:.3}
body.picking .coin.ok .tile{outline-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.coin.hot .tile{transform:scale(1.08);outline-color:var(--gold);box-shadow:0 0 0 6px var(--ring)}
.coin.pulse .tile{animation:pulse .6s ease-out 1}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.dragghost{position:fixed;z-index:60;pointer-events:none;left:0;top:0;transform:translate(-50%,-50%) scale(1.08);box-shadow:var(--lift);border-radius:20px}
.dragghost .tile{transform:none!important;opacity:1!important}
.pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:40;width:min(480px,calc(100% - 24px));background:var(--surface);border:1px solid var(--border);box-shadow:var(--lift);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.pickbar span{flex:1}
.hint{margin:16px 20px 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.hint .x{margin-left:auto;color:var(--muted)}

/* tabbar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:700;padding:6px 0}
.tab .ico{font-size:22px;display:flex}
.tab.on{color:var(--accent)}
.plus{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .2s}
.plus:active{transform:scale(.92)}

/* views */
.view{padding:0 0 8px}
.vhd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.vhd h1{font-size:22px;line-height:28px;font-weight:800;margin:0;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;margin:10px 16px;padding:16px}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .big{font-size:40px;color:var(--faint);display:flex;justify-content:center;margin-bottom:8px}
.empty h3{color:var(--text);margin:0 0 4px;font-size:17px}

/* history */
.filters{display:flex;gap:8px;padding:4px 16px 8px;overflow-x:auto;scrollbar-width:none}
.search{margin:4px 16px 6px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0 12px;height:44px;color:var(--faint)}
.search input{flex:1;border:0;background:none;outline:none;color:var(--text);height:100%}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:700;white-space:nowrap;color:var(--text);border:1px solid transparent}
.chip.on{background:color-mix(in srgb,var(--gold) 22%,var(--surface));border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.chip.dim{color:var(--muted)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:12px}
.day{display:flex;justify-content:space-between;padding:16px 20px 6px}
.txrow{display:flex;align-items:center;gap:12px;padding:10px 20px;width:100%;text-align:left}
.txrow:hover{background:var(--surface-2)}
.txrow .tile{width:42px;height:42px;border-radius:14px;font-size:19px;flex:none}
.txrow .mid{flex:1;min-width:0}
.txrow .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow .sum{font-weight:800;white-space:nowrap}

/* overview */
.mswitch{display:flex;align-items:center;justify-content:space-between;margin:4px 16px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.mswitch b{font-size:15px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;margin:10px 16px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.donutwrap{display:flex;justify-content:center;padding:10px 0 4px;position:relative}
.donutc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donutc .v{font-size:24px;font-weight:800;letter-spacing:-.01em}
.legend .li{display:flex;align-items:center;gap:12px;padding:9px 4px;width:100%;text-align:left;border-radius:12px}
.legend .li:hover{background:var(--surface-2)}
.legend .tile{width:38px;height:38px;border-radius:12px;font-size:17px;flex:none}
.legend .mid{flex:1;min-width:0}
.legend .row1{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.legend .row2{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.legend .pb{height:4px;background:var(--surface-2);border-radius:2px;margin-top:5px;overflow:hidden}
.legend .pb i{display:block;height:100%;border-radius:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(520px,100%);max-height:calc(92dvh - env(safe-area-inset-top));overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;z-index:55;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transition:transform .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.on{transform:translate(-50%,0)}
.handle{width:38px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px}
.sheet h2{font-size:20px;margin:0 0 12px;font-weight:800}
.route{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:700;flex-wrap:wrap}
.route .pt{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface-2)}
.route .pt .tile{width:28px;height:28px;border-radius:9px;font-size:15px}
.route select{background:var(--surface-2);border:0;border-radius:999px;height:40px;padding:0 14px;font-weight:700;max-width:46%}
.amount{text-align:center;font-size:44px;line-height:52px;font-weight:800;letter-spacing:-.02em;margin:14px 0 0;min-height:52px;word-break:break-all}
.expr{text-align:center;font-size:13px;color:var(--muted);min-height:18px;font-weight:600}
.note{text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);min-height:18px;margin-top:4px}
.note.warn{color:var(--warn)}.note.over{color:var(--danger)}
.chips{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap;justify-content:center}
.chips label.chip{position:relative;cursor:pointer}
.chips input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.extra{display:grid;gap:8px;margin-bottom:10px}
.field{width:100%;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);padding:0 14px;outline:none}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--ring)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:56px;border-radius:14px;background:var(--surface-2);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}
.key:active{transform:scale(.95);background:var(--border)}
.key.op{background:var(--border);color:var(--muted)}
.btn{height:52px;border-radius:999px;width:100%;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--surface-2)}
.btn.danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.btn.ghost{color:var(--muted)}
.btns{display:grid;gap:8px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.err{color:var(--danger);font-size:13px;font-weight:700;text-align:center;min-height:18px;margin-top:6px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:14px 2px 6px}
.icongrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icongrid button{aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);border:2px solid transparent}
.icongrid button.on{border-color:var(--gold);color:var(--text);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.swatches button.on{box-shadow:0 0 0 2px var(--text)}
.preview{display:flex;justify-content:center;margin:4px 0 6px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:var(--surface-2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:18px;font-weight:800;margin-top:2px}
.choice{display:grid;gap:10px}
.choice button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--surface-2);text-align:left;font-weight:700;font-size:16px}
.choice button small{display:block;font-weight:600;font-size:12.5px;color:var(--muted)}
.choice .tile{width:46px;height:46px;border-radius:15px;font-size:22px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1}
.card.set{padding:16px}
.set h3{font-size:13px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
textarea.field{height:120px;padding:10px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--text);color:var(--bg);border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:14px;transition:all .25s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:calc(100% - 24px)}
.sheet.on~.toast{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--gold);font-weight:800;padding:4px 6px}

/* welcome */
.welcome{min-height:calc(100dvh - env(safe-area-inset-top));display:flex;flex-direction:column;justify-content:center;padding:32px 28px;max-width:440px;margin:0 auto}
.logo{width:72px;height:72px;border-radius:24px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:22px}
.welcome h1{font-size:30px;line-height:36px;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.welcome p{color:var(--muted);margin:0 0 22px}
.feat{display:grid;gap:14px;margin:0 0 28px}
.feat div{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.feat .tile{width:40px;height:40px;border-radius:13px;font-size:19px;flex:none}
.loading{min-height:70dvh;display:flex;align-items:center;justify-content:center;color:var(--muted);gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--gold);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.auth .field{margin-bottom:10px;height:52px;font-size:16px}
.auth .link{display:block;margin:14px auto 0;color:var(--muted);font-weight:700;font-size:14px}
.install{display:flex;gap:12px;align-items:flex-start;font-size:13px;font-weight:600}
.install b{display:block;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){#app{padding-top:12px}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>Загружаю…</div></div>
<nav class="tabs" id="tabs" hidden>

/* --- auth (Supabase Auth REST) --- */
const Auth={s:LS.get('mk.session',null)};
class ApiError extends Error{constructor(m,status,code){super(m);this.status=status;this.code=code}}
async function authReq(path,body){
  let r;try{r=await fetch(CFG.supabaseUrl+'/auth/v1/'+path,{method:'POST',headers:{'apikey':CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(body)})}
  catch(e){throw new ApiError('Нет связи с сервером',0,'network')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new ApiError(j.error_description||j.msg||j.message||('HTTP '+r.status),r.status,j.error_code||j.code||j.error);
  return j;
}
function setSession(j){
  const prev=LS.get('mk.uid',null);
  if(prev&&prev!==j.user.id){LS.set('mk.docs',{});LS.set('mk.outbox',{});LS.set('mk.last',null);LS.set('mk.pulled',false);Store.docs={}}
  LS.set('mk.uid',j.user.id);
  Auth.s={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,user:{id:j.user.id,email:j.user.email}};
  LS.set('mk.session',Auth.s);
}
Auth.recover=async(email)=>{const back=location.origin+location.pathname;await authReq('recover?redirect_to='+encodeURIComponent(back),{email})};
Auth.setPassword=async(password)=>{const t=await Auth.token();let r;try{r=await fetch(CFG.supabaseUrl+'/auth/v1/user',{method:'PUT',headers:{'apikey':CFG.supabaseAnonKey,'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({password})})}catch(e){throw new ApiError('Нет связи с сервером',0,'network')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new ApiError(j.msg||j.message||('HTTP '+r.status),r.status,j.error_code||j.code)};
/* ссылка из письма «сбросить пароль» приходит с токенами в адресе после # */
Auth.fromLink=async()=>{
  const h=new URLSearchParams((location.hash||'').replace(/^#/,''));
  if(h.get('error_description')){history.replaceState(null,'',location.pathname+location.search);return {error:h.get('error_description')}}
  if(!h.get('access_token'))return null;
  const type=h.get('type');const at=h.get('access_token'),rt=h.get('refresh_token'),exp=Number(h.get('expires_in')||3600);
  history.replaceState(null,'',location.pathname+location.search);
  try{const r=await fetch(CFG.supabaseUrl+'/auth/v1/user',{headers:{'apikey':CFG.supabaseAnonKey,'Authorization':'Bearer '+at}});const u=await r.json();if(!r.ok)throw 0;
    setSession({access_token:at,refresh_token:rt,expires_in:exp,user:u});return {type}}catch(e){return {error:'Ссылка устарела. Запросите новую.'}}
};
Auth.signIn=async(email,password)=>{setSession(await authReq('token?grant_type=password',{email,password}))};
Auth.signUp=async(email,password)=>{const j=await authReq('signup',{email,password});if(j.access_token&&j.user){setSession(j);return true}return false};
let refreshing=null;
Auth.token=async()=>{
  if(!Auth.s)throw new ApiError('Не выполнен вход',401,'no_session');
  if(Date.now()>Auth.s.expires_at-60000){
    refreshing=refreshing||authReq('token?grant_type=refresh_token',{refresh_token:Auth.s.refresh_token}).then(setSession).finally(()=>{refreshing=null});
    try{await refreshing}catch(e){if(e.status>=400&&e.status<500){Auth.s=null;LS.set('mk.session',null)}throw e}
  }
  return Auth.s.access_token;
};
Auth.signOut=()=>{
  const s=Auth.s;Auth.s=null;
  if(s)fetch(CFG.supabaseUrl+'/auth/v1/logout',{method:'POST',headers:{'apikey':CFG.supabaseAnonKey,'Authorization':'Bearer '+s.access_token}}).catch(()=>{});
  ['mk.session','mk.docs','mk.outbox','mk.last','mk.pulled','mk.uid','mk.book'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  Store.docs={};prefs.book=null;setSync('auth');
};

/* --- sync: push the outbox, then pull what changed since last time --- */
async function rest(path,opt){
  const t=await Auth.token();
  let r;try{r=await fetch(CFG.supabaseUrl+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({'apikey':CFG.supabaseAnonKey,'Authorization':'Bearer '+t,'Content-Type':'application/json'},(opt&&opt.headers)||{})}))}
  catch(e){throw new ApiError('Нет связи',0,'network')}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new ApiError(j.message||('HTTP '+r.status),r.status,j.code)}
  return r;
}
const Sync={busy:false,again:false,kt:null,lastOk:null};
Sync.kick=()=>{clearTimeout(Sync.kt);Sync.kt=setTimeout(()=>Sync.run(),400)};
Sync.run=async function(){
  if(!HAS_CLOUD||!Auth.s)return;
  if(Sync.busy){Sync.again=true;return}
  if(navigator.onLine===false){setSync('offline');return}
  Sync.busy=true;Sync.again=false;
  if(Store.sync!=='ok')setSync('wait');
  let failed=false;
  try{
    const sent=obGet();const ids=Object.keys(sent);
    for(let i=0;i<ids.length;i+=200){
      const rows=ids.slice(i,i+200).map(id=>({id,body:sent[id].body||{},deleted:!!sent[id].deleted}));
      await rest('docs?on_conflict=user_id,id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
    }
    if(ids.length){const now=obGet();for(const id of ids)if(now[id]&&sent[id]&&now[id].t===sent[id].t)delete now[id];obSet(now)}
    const last=LS.get('mk.last',null);
    let since=last?new Date(new Date(last).getTime()-120000).toISOString():'1970-01-01T00:00:00Z';
    let maxSeen=last,changed=false;const pending=obGet();
    mergeLatest('\u0000');
    for(let page=0;page<50;page++){
      const r=await rest('docs?select=id,body,deleted,updated_at&updated_at=gt.'+encodeURIComponent(since)+'&order=updated_at.asc&limit=1000');
      const rows=await r.json();
      for(const x of rows){
        if(!pending[x.id]){
          if(x.deleted){if(x.id in Store.docs){delete Store.docs[x.id];changed=true}}
          else if(JSON.stringify(Store.docs[x.id])!==JSON.stringify(x.body)){Store.docs[x.id]=x.body;changed=true}
        }
        since=x.updated_at;if(!maxSeen||x.updated_at>maxSeen)maxSeen=x.updated_at;
      }
      if(rows.length<1000)break;
    }
    if(maxSeen)LS.set('mk.last',maxSeen);
    const first=!LS.get('mk.pulled',false);LS.set('mk.pulled',true);
    if(changed)LS.set('mk.docs',Store.docs);
    Sync.lastOk=Date.now();Sync.lastErr='';
    setSync(Object.keys(obGet()).length?'wait':'ok');
    if(changed||first){if(!dragging)emit()}
  }catch(e){
    failed=true;
    if(!Auth.s||e.status===401){setSync('auth');if(!Auth.s)emit()}
    else{Sync.lastErr=e.code==='PGRST205'||e.code==='42P01'?'В базе нет таблицы docs — выполните SQL из инструкции (Supabase → SQL Editor).':e.code==='network'?'':String(e.message||'').slice(0,160);setSync(e.code==='network'?'offline':'err')}
    if(!LS.get('mk.pulled',false))emit();
  }finally{
    Sync.busy=false;
    if(Sync.again||(!failed&&Object.keys(obGet()).length))Sync.kick();
  }
};
window.addEventListener('online',()=>Sync.run());
window.addEventListener('offline',()=>setSync('offline'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')Sync.run()});
setInterval(()=>{if(document.visibilityState==='visible')Sync.run()},20000);

/* periods with custom month start */
function mStart(){return Math.min(28,Math.max(1,settings().monthStart||1))}
function periodOf(date){const s=mStart();let [y,m,d]=date.split('-').map(Number);if(d<s){m--;if(m<1){m=12;y--}}return {y,m}}
function shiftP(p,n){let m=p.m+n,y=p.y;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return {y,m}}
function pBounds(p){const s=mStart();const a=p.y+'-'+pad(p.m)+'-'+pad(s);const n=shiftP(p,1);const b=addDays(n.y+'-'+pad(n.m)+'-'+pad(s),-1);return [a,b]}
function pLabel(p){const s=mStart();if(s===1)return cap1(MN[p.m-1])+(p.y!==new Date().getFullYear()?' '+p.y:'');const [a,b]=pBounds(p);const f=x=>{const [,mm,dd]=x.split('-').map(Number);return dd+' '+MS[mm-1]};return f(a)+' – '+f(b)}
const curP=()=>periodOf(todayStr());

function stats(p){
  p=p||curP();const [a,b]=pBounds(p);
  const bal={},flow={};
  coins(null,true).forEach(c=>{bal[c.id]=c.kind==='account'?(c.initial||0):0;flow[c.id]=0});
  let inc=0,exp=0;
  for(const t of allTx()){
    const amt=t.amount||0;const inP=t.date>=a&&t.date<=b;
    if(t.type==='income'){bal[t.to]=(bal[t.to]||0)+amt;if(inP){flow[t.from]=(flow[t.from]||0)+amt;inc+=amt}}
    else if(t.type==='expense'){bal[t.from]=(bal[t.from]||0)-amt;if(inP){flow[t.to]=(flow[t.to]||0)+amt;exp+=amt}}
    else if(t.type==='transfer'){bal[t.from]=(bal[t.from]||0)-amt;bal[t.to]=(bal[t.to]||0)+(t.toAmount||amt)}
  }
  let total=0;coins('account').forEach(c=>total+=bal[c.id]||0);
  let lim=0,limSpent=0;coins('expense').forEach(c=>{if(c.limit){lim+=c.limit;limSpent+=flow[c.id]||0}});
  return {bal,flow,inc,exp,total,lim,limSpent,a,b};
}
function typeFor(from,to){const f=coin(from),t=coin(to);if(!f||!t||f.id===t.id)return null;if(f.kind==='income'&&t.kind==='account')return 'income';if(f.kind==='account'&&t.kind==='expense')return 'expense';if(f.kind==='account'&&t.kind==='account')return 'transfer';return null}
function targetsFor(id){const f=coin(id);if(!f)return [];if(f.kind==='income')return coins('account').map(c=>c.id);if(f.kind==='account')return coins('account').filter(c=>c.id!==id).concat(coins('expense')).map(c=>c.id);return []}

let dragging=null,press=null;
function clearPick(){pick=null;document.body.classList.remove('picking');$$('.coin').forEach(c=>c.classList.remove('ok','sel','hot','src'));const pb=$('#pickbar');if(pb)pb.remove()}
function applyPick(){const ok=targetsFor(pick);document.body.classList.add('picking');$$('.coin[data-id]').forEach(el=>{el.classList.toggle('ok',ok.includes(el.dataset.id));el.classList.toggle('sel',el.dataset.id===pick)});
  if(!$('#pickbar')){const c=coin(pick);const d=document.createElement('div');d.className='pickbar';d.id='pickbar';d.innerHTML='<span>«'+esc(c.name)+'» → выберите '+(c.kind==='income'?'счёт':'счёт или категорию')+'</span><button class="chip" id="pbopen">'+icon('info','i')+'Открыть</button><button class="chip dim" id="pbx">Отмена</button>';document.body.appendChild(d);paintIcons();$('#pbx').onclick=clearPick;$('#pbopen').onclick=()=>{const id=pick;clearPick();openCoinDetail(id)}}}
document.addEventListener('pointerdown',e=>{
  if(view!=='main'||$('#sheet').classList.contains('on'))return;
  const el=e.target.closest('.coin[data-id]');
  if(!el){if(pick&&!e.target.closest('#pickbar'))clearPick();return}
  press={el,id:el.dataset.id,kind:el.dataset.kind,x:e.clientX,y:e.clientY,pid:e.pointerId,type:e.pointerType,moved:false};
});
document.addEventListener('pointermove',e=>{
  if(dragging){e.preventDefault();moveDrag(e.clientX,e.clientY);return}
  if(!press||e.pointerId!==press.pid)return;
  const dx=e.clientX-press.x,dy=e.clientY-press.y;
  if(Math.hypot(dx,dy)>8){press.moved=true;
    if(press.kind==='expense'){press=null;return}
    if(press.type==='touch'&&Math.abs(dx)>Math.abs(dy)&&press.el.closest('.hrow')){press=null;return}
    startDrag(e);
  }
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(dragging){endDrag(e.clientX,e.clientY);return}
  if(press&&!press.moved&&e.pointerId===press.pid){const p=press;press=null;onTap(p.id);return}
  press=null;
});
document.addEventListener('pointercancel',()=>{if(dragging)cancelDrag();press=null});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.coin'))e.preventDefault()});
function onTap(id){
  const c=coin(id);if(!c)return;
  if(!pick){if(c.kind==='expense'){openCoinDetail(id);return}pick=id;applyPick();return}
  if(id===pick){clearPick();openCoinDetail(id);return}
  if(typeFor(pick,id)){const f=pick;clearPick();openTx({from:f,to:id});return}
  if(c.kind!=='expense'){clearPick();pick=id;applyPick();return}
  const el=$('.coin[data-id="'+id+'"] .tile');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
}
function startDrag(e){
  clearPick();
  const src=press.el;dragging={id:press.id,src,hot:null,ok:targetsFor(press.id)};press=null;
  try{src.setPointerCapture(e.pointerId)}catch(_){}
  const g=document.createElement('div');g.className='dragghost coin';g.style.setProperty('--c',src.style.getPropertyValue('--c'));g.innerHTML=src.querySelector('.tile').outerHTML;document.body.appendChild(g);dragging.g=g;
  src.classList.add('src');document.body.classList.add('picking');
  $$('.coin[data-id]').forEach(el=>{if(dragging.ok.includes(el.dataset.id))el.classList.add('ok')});
  try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
  moveDrag(e.clientX,e.clientY);
}
function moveDrag(x,y){
  const d=dragging;d.g.style.left=x+'px';d.g.style.top=y+'px';
  const el=document.elementFromPoint(x,y);const c=el&&el.closest('.coin[data-id]');
  const hot=c&&d.ok.includes(c.dataset.id)?c:null;
  if(hot!==d.hot){if(d.hot)d.hot.classList.remove('hot');if(hot){hot.classList.add('hot');try{navigator.vibrate&&navigator.vibrate(5)}catch(_){}}d.hot=hot}
}
function endDrag(){const d=dragging;const to=d.hot&&d.hot.dataset.id;cancelDrag();if(to)openTx({from:d.id,to})}
function cancelDrag(){const d=dragging;if(!d)return;d.g.remove();$$('.coin').forEach(c=>c.classList.remove('ok','hot','src'));document.body.classList.remove('picking');dragging=null}

/* ---------- calculator ---------- */
function evalExpr(s){
  s=s.replace(/,/g,'.');if(!s)return 0;
  const tk=s.match(/\d*\.?\d+|\d+\.|[+\-×÷]/g)||[];
  const nums=[],ops=[];let expectNum=true;
  for(const t of tk){if('+-×÷'.includes(t)){if(expectNum)return NaN;ops.push(t);expectNum=true}else{nums.push(parseFloat(t));expectNum=false}}
  if(expectNum&&ops.length)ops.pop();
  if(!nums.length)return 0;
  const n=[nums[0]],o=[];
  for(let i=0;i<ops.length;i++){const op=ops[i],v=nums[i+1];if(v===undefined)break;if(op==='×')n[n.length-1]*=v;else if(op==='÷')n[n.length-1]=v===0?NaN:n[n.length-1]/v;else{o.push(op);n.push(v)}}
  let r=n[0];for(let i=0;i<o.length;i++)r=o[i]==='+'?r+n[i+1]:r-n[i+1];
  return r;
}

function openTx(o){
  const edit=o.tx||null;
  let from=edit?edit.from:o.from,to=edit?edit.to:o.to;
  let expr=edit?String(edit.amount/100).replace('.',','):'';
  let date=edit?edit.date:todayStr();
  let comment=edit?(edit.comment||''):'';
  let tags=edit?(edit.tags||[]).join(' '):'';
  const showRoute=!!(edit||o.pickRoute);
  const routeHTML=()=>{
    const f=coin(from),t=coin(to);
    if(!showRoute)return '<div class="route"><span class="pt">'+tileHTML(f)+esc(f.name)+'</span><span style="color:var(--faint)">'+icon('arrow-right','→')+'</span><span class="pt">'+tileHTML(t)+esc(t.name)+'</span></div>';
    const type=typeFor(from,to);
    const fl=type==='income'?coins('income'):coins('account');
    const tl=type==='income'?coins('account'):type==='transfer'?coins('account'):coins('expense');
    const opt=(l,v)=>l.map(c=>'<option value="'+c.id+'"'+(c.id===v?' selected':'')+'>'+esc(c.name)+'</option>').join('');
    return '<div class="route"><select id="rf" aria-label="Откуда">'+opt(fl,from)+'</select><span style="color:var(--faint)">'+icon('arrow-right','→')+'</span><select id="rt" aria-label="Куда">'+opt(tl,to)+'</select></div>';

  h+='<div class="donutwrap"><svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Распределение по категориям"><circle r="'+R+'" cx="100" cy="100" fill="none" stroke="var(--surface-2)" stroke-width="20"/>'+segs+'</svg><div class="donutc"><span class="cap">'+(kind==='expense'?'Расходы':'Доходы')+'</span><span class="v num">'+money(total)+'</span></div></div>';

  const ss=ps.map(x=>stats(x));const mx=Math.max(1,...ss.map(s=>Math.max(s.inc,s.exp)));
  const W=320,H=150,bw=14;let bars='';
  ss.forEach((s,i)=>{const cx=28+i*(W-40)/5;const hi=Math.round(s.inc/mx*(H-30)),he=Math.round(s.exp/mx*(H-30));
    bars+='<rect x="'+(cx-bw-1)+'" y="'+(H-20-hi)+'" width="'+bw+'" height="'+Math.max(hi,s.inc?2:0)+'" rx="5" fill="var(--inc)"/><rect x="'+(cx+1)+'" y="'+(H-20-he)+'" width="'+bw+'" height="'+Math.max(he,s.exp?2:0)+'" rx="5" fill="var(--exp)"/>'+
      '<text x="'+cx+'" y="'+(H-4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(i===5?'var(--text)':'var(--faint)')+'">'+MS[ps[i].m-1]+'</text>'});
  const net=st.inc-st.exp;
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="cap">Доходы и расходы</span><span class="num" style="font-weight:800;font-size:13px;color:'+(net>=0?'var(--inc)':'var(--danger)')+'">'+(net>=0?'+':'−')+money(Math.abs(net))+' за период</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Доходы и расходы по месяцам" style="margin-top:10px;display:block"><line x1="0" x2="'+W+'" y1="'+(H-20)+'" y2="'+(H-20)+'" stroke="var(--border)"/>'+bars+'</svg>'+
    '<div style="display:flex;gap:16px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px"><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--inc);margin-right:6px"></span>Доходы</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--exp);margin-right:6px"></span>Расходы</span></div></div>';
  app.innerHTML='<div class="view">'+h+'</div>';
  renderSync($('#sync'));
  $('#pprev').onclick=()=>{ui.ovP=shiftP(p,-1);render()};
  $('#pnext').onclick=()=>{ui.ovP=shiftP(p,1);render()};
  $$('.seg [data-k]').forEach(b=>b.onclick=()=>{ui.ovKind=b.dataset.k;render()});
  $$('.legend [data-c]').forEach(b=>b.onclick=()=>openCoinDetail(b.dataset.c));
}

/* ---------- settings ---------- */
function openBooks(){
  const l=books();
  openSheet('<h2>Книги учёта</h2><p style="color:var(--muted);margin:-4px 0 8px;font-size:13px">Каждая книга — отдельные счета, категории и операции. Например, личные деньги и бизнес.</p><div class="list">'+l.map(b=>'<button class="it" data-b="'+b.id+'">'+tileHTML({color:b.id===bid()?'#F5B83D':'#8E99AB',icon:'book-open',name:b.name})+'<span class="grow" style="font-weight:700">'+esc(b.name)+'</span>'+(b.id===bid()?icon('check','✓'):'')+'</button>').join('')+'</div>'+
  '<div class="lbl">Новая книга</div><div style="display:flex;gap:8px"><input class="field" id="nb" placeholder="Автовоз Гарант" maxlength="30"><button class="btn primary" id="nbok" style="width:auto;padding:0 20px">Создать</button></div><div class="err" id="nberr"></div>',s=>{
    $$('[data-b]',s).forEach(b=>b.onclick=()=>{prefs.book=b.dataset.b;LS.set('mk.book',prefs.book);closeSheet();ui.ovP=null;render();toast('Книга: '+curBook().name)});
    $('#nbok',s).onclick=()=>{const n=$('#nb',s).value.trim();if(!n){$('#nberr',s).textContent='Введите название';return}closeSheet();createBook(n);toast('Создана книга «'+n+'»')};
  });
}
function renderSettings(app){
  const b=curBook();const s=settings();
  let h='<div class="vhd"><h1>Настройки</h1><span id="sync"></span></div>';
  h+='<div class="card set"><h3>Тема</h3><div class="seg" style="margin:0"><button data-th="system" class="'+(prefs.theme==='system'?'on':'')+'">Как в системе</button><button data-th="light" class="'+(prefs.theme==='light'?'on':'')+'">Светлая</button><button data-th="dark" class="'+(prefs.theme==='dark'?'on':'')+'">Тёмная</button></div><p style="font-size:12.5px;color:var(--muted);margin:10px 2px 0">«Как в системе» — днём светлая, ночью тёмная, вместе с телефоном.</p></div>';
  h+='<div class="card set"><h3>Книга «'+esc(b.name)+'»</h3><div class="list">'+
    '<button class="it" id="sbooks">'+icon('book-open','')+'<span class="grow">Все книги</span><span style="color:var(--muted)">'+books().length+'</span></button>'+
    '<button class="it" id="sren">'+icon('pencil','')+'<span class="grow">Переименовать</span></button>'+
    '<div class="it">'+icon('calendar-range','')+'<span class="grow">Начало месяца</span><select class="chip" id="mstart">'+Array.from({length:28},(_,i)=>'<option value="'+(i+1)+'"'+((s.monthStart||1)===i+1?' selected':'')+'>'+(i+1)+' число</option>').join('')+'</select></div>'+
    '<button class="it" id="sarch">'+icon('archive','')+'<span class="grow">Скрытые монетки</span><span style="color:var(--muted)">'+coins(null,true).filter(c=>c.archived).length+'</span></button></div></div>';
  if(HAS_CLOUD&&Auth.s){const pend=Object.keys(obGet()).length;h+='<div class="card set"><h3>Аккаунт</h3><div class="list"><div class="it">'+icon('circle-dollar-sign')+'<span class="grow" style="font-weight:700">'+esc(Auth.s.user.email)+'</span></div>'+
    '<button class="it" id="ssync">'+icon('trending-up')+'<span class="grow">Синхронизировать сейчас</span><span style="color:var(--muted);font-size:13px">'+(pend?'ждут отправки: '+pend:Sync.lastOk?'готово':'')+'</span></button>'+
    '<button class="it" id="sout2" style="color:var(--danger)">'+icon('x')+'<span class="grow">Выйти</span></button></div></div>'}
  h+='<div class="card set"><h3>Данные</h3><p style="font-size:13px;color:var(--muted);margin:0 0 12px">'+(HAS_CLOUD?'Данные хранятся в вашей базе Supabase и на этом устройстве. Без интернета всё работает, изменения отправятся при появлении связи. Видите их только вы.':'Данные хранятся только в этом браузере. Чтобы включить синхронизацию, укажите адрес и ключ Supabase в config.js.')+'</p><div class="list">'+
    '<button class="it" id="sexp">'+icon('copy','')+'<span class="grow">Скопировать резервную копию (JSON)</span></button>'+
    '<button class="it" id="scsv">'+icon('table','')+'<span class="grow">Скопировать операции (CSV для Excel)</span></button>'+
    '<label class="it" style="cursor:pointer">'+icon('upload','')+'<span class="grow">Восстановить из файла JSON</span><input type="file" id="simp" accept=".json,application/json" hidden></label></div><textarea class="field" id="sout" readonly hidden></textarea></div>';
  h+='<p style="text-align:center;color:var(--faint);font-size:12px;margin:18px 0 8px">Версия 2.0 · сделано с Claude</p>';
  app.innerHTML='<div class="view">'+h+'</div>';
  renderSync($('#sync'));
  $$('[data-th]').forEach(x=>x.onclick=()=>{prefs.theme=x.dataset.th;LS.set('mk.theme',prefs.theme);applyTheme();render()});
  $('#sbooks').onclick=openBooks;
  const ss=$('#ssync');if(ss)ss.onclick=async()=>{await Sync.run();render();toast(Store.sync==='ok'?'Всё синхронизировано':'Не получилось — проверьте интернет')};
  const so=$('#sout2');if(so){let armed=false;so.onclick=()=>{const pend=Object.keys(obGet()).length;if(!armed){armed=true;so.querySelector('.grow').textContent=pend?'Не отправлено '+pend+' изменений. Всё равно выйти?':'Точно выйти?';return}Auth.signOut();render()}}
  $('#sren').onclick=()=>openSheet('<h2>Название книги</h2><input class="field" id="rn" maxlength="30" value="'+esc(b.name)+'"><div class="err" id="rnerr"></div><div class="btns"><button class="btn primary" id="rnok">Сохранить</button></div>',sh=>{$('#rn',sh).focus();$('#rnok',sh).onclick=()=>{const n=$('#rn',sh).value.trim();if(!n){$('#rnerr',sh).textContent='Введите название';return}const st=settings();Store.put('books',Object.assign({},st,{list:books().map(x=>x.id===b.id?Object.assign({},x,{name:n}):x)}));closeSheet();emit()}});
  $('#mstart').onchange=e=>{Store.put('books',Object.assign({},settings(),{monthStart:Number(e.target.value)}));ui.ovP=null;emit();toast('Месяц начинается '+e.target.value+' числа')};
  $('#sarch').onclick=()=>{const a=coins(null,true).filter(c=>c.archived);openSheet('<h2>Скрытые монетки</h2>'+(a.length?'<div class="list">'+a.map(c=>'<div class="it">'+tileHTML(c)+'<span class="grow" style="font-weight:700">'+esc(c.name)+'</span><button class="chip" data-un="'+c.id+'">Вернуть</button></div>').join('')+'</div>':'<div class="empty" style="padding:24px">Скрытых монеток нет</div>'),sh=>{$$('[data-un]',sh).forEach(x=>x.onclick=()=>{const st=JSON.parse(JSON.stringify(state()));st.coins=st.coins.map(c=>c.id===x.dataset.un?Object.assign({},c,{archived:false}):c);saveState(st);closeSheet();toast('Монетка возвращена')})})};
  const out=$('#sout');
  const copy=async(text,label)=>{out.hidden=false;out.value=text;try{await navigator.clipboard.writeText(text);toast(label+' скопировано')}catch(e){out.focus();out.select();toast('Выделено — скопируйте вручную')}};
  $('#sexp').onclick=()=>{const d={app:'moi-dengi',version:1,exported:new Date().toISOString(),book:b,monthStart:s.monthStart||1,state:state(),tx:allTx()};copy(JSON.stringify(d),'Резервная копия')};
  $('#scsv').onclick=()=>{const rows=[['Дата','Тип','Откуда','Куда','Сумма','Комментарий','Теги']];const tl={income:'Доход',expense:'Расход',transfer:'Перевод'};allTx().forEach(t=>rows.push([t.date,tl[t.type],(coin(t.from)||{}).name||'',(coin(t.to)||{}).name||'',String(t.amount/100).replace('.',','),t.comment||'',(t.tags||[]).join(' ')]));copy(rows.map(r=>r.map(v=>/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v).join(';')).join('\n'),'CSV')};
  $('#simp').onchange=e=>{const f=e.target.files[0];if(!f)return;readBackup(f,d=>{
    openSheet('<h2>Восстановить данные?</h2><p style="color:var(--muted)">Книга «'+esc(b.name)+'» будет заменена данными из файла: '+(d.state.coins||[]).length+' монеток и '+d.tx.length+' операций от '+esc((d.exported||'').slice(0,10))+'.</p><div class="btns two"><button class="btn secondary" id="imno">Отмена</button><button class="btn primary" id="imok">Заменить</button></div>',sh=>{
      $('#imno',sh).onclick=closeSheet;
      $('#imok',sh).onclick=()=>{importBook(d,bid());closeSheet();emit();toast('Данные восстановлены')}})});e.target.value=''};
}

/* ---------- boot ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
route();
Store.init().then(render).catch(e=>{console.error(e);Store.mode='local';Store.synced=true;setSync('local');render()});
</script>
</body>
